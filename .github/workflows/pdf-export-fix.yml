name: PDF export repair

on:
  push:
    paths:
      - '.github/workflows/pdf-export-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Repair PDF capture and pagination
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('assets/js/submission-hotfix.js')
          text = js.read_text(encoding='utf-8')

          replacements = [
              (
                  'margin: [10, 12, 14, 12],',
                  'margin: [8, 10, 12, 10],'
              ),
              (
                  'windowWidth: Math.max(900, node.scrollWidth + 40),\n          width: node.scrollWidth',
                  'windowWidth: Math.max(1, Math.ceil(node.getBoundingClientRect().width)),\n          windowHeight: Math.max(1, Math.ceil(node.scrollHeight)),\n          width: Math.max(1, Math.ceil(node.getBoundingClientRect().width)),\n          height: Math.max(1, Math.ceil(node.scrollHeight)),\n          x: 0,\n          y: 0'
              ),
              (
                  'avoid: [".pdf-field", ".pdf-summary-card", ".pdf-section-head", ".pdf-note"]',
                  'avoid: [".pdf-summary-card", ".pdf-section-head", ".pdf-note"]'
              ),
              (
                  'Claude Builder Club - AOU Egypt',
                  'Claude Builder Club @ AOU Egypt'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  print(f'Warning: expected snippet not found: {old[:80]}')
              text = text.replace(old, new)

          js.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('site.css?v=20261013pdf4', 'site.css?v=20261013pdf5')
          html = html.replace('submission-hotfix.js?v=20261013pdf4', 'submission-hotfix.js?v=20261013pdf5')
          index.write_text(html, encoding='utf-8')
          PY

      - name: Publish repair and remove one-time workflow
        run: |
          rm -f .github/workflows/pdf-export-fix.yml
          git config user.name "Claude AOU Release"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/submission-hotfix.js index.html .github/workflows/pdf-export-fix.yml
          if git diff --cached --quiet; then
            echo "No PDF changes needed"
            exit 0
          fi
          git commit -m "Fix application PDF export layout"
          git push
