name: Rename club display

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rename-club-display.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Replace club name everywhere
        shell: python
        run: |
          from pathlib import Path

          old = "Claude Builder Club — AOU Egypt"
          new = "Claude Builder Club @ AOU Egypt"
          changed = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          index = Path('index.html')
          if index.exists():
              text = index.read_text(encoding='utf-8')
              text = text.replace('app.js?v=20261013orgrelease1', 'app.js?v=20261013brandname2')
              text = text.replace('submission-hotfix.js?v=20261013orgrelease1', 'submission-hotfix.js?v=20261013brandname2')
              index.write_text(text, encoding='utf-8')

          print('Changed files:')
          print('\n'.join(changed) if changed else 'No matching files found')

      - name: Publish rename and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Claude AOU Release"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/rename-club-display.yml
          git add -A
          git commit -m "Rename club display to Claude Builder Club @ AOU Egypt"
          git push origin main
