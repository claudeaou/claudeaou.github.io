name: Finalize organization release cache

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cache-bust-org-release.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump public asset versions
        shell: python
        run: |
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace("claude-spark.svg?v=20261013brandpack3", "claude-spark.svg?v=20261013orgrelease1")
          text = text.replace("site.css?v=20261013brandpack3", "site.css?v=20261013orgrelease1")
          text = text.replace("config.js?v=20261013a1", "config.js?v=20261013orgrelease1")
          text = text.replace("app.js?v=20261013a1", "app.js?v=20261013orgrelease1")
          text = text.replace("submission-hotfix.js?v=20261013a1", "submission-hotfix.js?v=20261013orgrelease1")
          text = text.replace("revamp.js?v=20261013a1", "revamp.js?v=20261013orgrelease1")
          path.write_text(text, encoding="utf-8")

      - name: Commit cache-safe release
        shell: bash
        run: |
          git config user.name "Claude AOU Release"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Asset versions already finalized."
            exit 0
          fi
          git commit -m "Finalize organization site asset cache versions"
          git push origin main
