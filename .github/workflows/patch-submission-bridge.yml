name: Patch verified submission bridge

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-submission-bridge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch verified submission transport
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/js/submission-hotfix.js')
          text = path.read_text(encoding='utf-8')

          origin_line = '  const OFFICIAL_ORIGIN = "https://claudeaou.github.io";\n'
          bridge_lines = (
              origin_line
              + '  const BRIDGE_ORIGIN = "https://mhmdwaelanwr.github.io";\n'
              + '  const BRIDGE_URL = `${BRIDGE_ORIGIN}/hiring-cbc/bridge.html`;\n'
          )
          if 'const BRIDGE_ORIGIN' not in text:
              if origin_line not in text:
                  raise SystemExit('OFFICIAL_ORIGIN marker not found')
              text = text.replace(origin_line, bridge_lines, 1)

          start_marker = '  async function submitVerified() {'
          end_marker = '\n  /*\n    Capture only the final Submit click'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('submitVerified markers not found')

          replacement = '''  async function submitVerified() {
            if (!recruitmentOpen()) {
              alert("Applications are not open.");
              return;
            }

            setBusy(true);

            const cleanPayload = formObject();
            const fallbackReference = makeSubmissionReference();
            const nonce = makeNonce();
            const transportPayload = {
              ...cleanPayload,
              submission_reference: fallbackReference,
              _transport: "iframe",
              _nonce: nonce
            };

            let bridge = null;
            let timer = null;
            let settled = false;
            let sent = false;

            const cleanup = () => {
              if (timer) clearTimeout(timer);
              window.removeEventListener("message", onMessage);
              bridge?.remove();
            };

            const finishWithError = message => {
              if (settled) return;
              settled = true;
              cleanup();
              setBusy(false);
              alert(message || "We could not submit your application. Your draft is still saved on this device.");
            };

            const sendToBridge = () => {
              if (sent || settled || !bridge?.contentWindow) return;
              sent = true;
              bridge.contentWindow.postMessage({
                type: "CBC_BRIDGE_SUBMIT",
                nonce,
                endpoint: CFG.SUBMISSION_ENDPOINT,
                payload: transportPayload
              }, BRIDGE_ORIGIN);
            };

            const onMessage = event => {
              const data = event.data;
              if (
                settled ||
                !bridge ||
                event.source !== bridge.contentWindow ||
                event.origin !== BRIDGE_ORIGIN ||
                !data ||
                typeof data !== "object"
              ) {
                return;
              }

              if (data.type === "CBC_BRIDGE_READY") {
                sendToBridge();
                return;
              }

              if (String(data.nonce || "") !== nonce) return;

              if (data.type === "CBC_BRIDGE_ERROR") {
                finishWithError(data.message || "The application service did not return a verified response.");
                return;
              }

              if (data.type !== "CBC_APPLICATION_RESULT") return;

              settled = true;
              cleanup();
              setBusy(false);

              if (data.ok) {
                showSuccessResult(data, cleanPayload, fallbackReference, false);
              } else {
                alert(data.message || "The application service rejected the submission. Your draft is still saved.");
              }
            };

            try {
              window.addEventListener("message", onMessage);

              bridge = document.createElement("iframe");
              bridge.src = `${BRIDGE_URL}?v=20261013org2`;
              bridge.hidden = true;
              bridge.setAttribute("aria-hidden", "true");
              bridge.addEventListener("load", () => setTimeout(sendToBridge, 0), { once: true });
              document.body.appendChild(bridge);

              timer = setTimeout(() => {
                finishWithError("The application service did not return a verified response in time. Your draft is saved, so please try again.");
              }, 50000);
            } catch (error) {
              console.error("Application submission failed:", error);
              finishWithError("We could not send your application. Your draft is saved on this device—please check your connection and try again.");
            }
          }
          '''

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check assets/js/submission-hotfix.js

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Claude AOU Migration"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/submission-hotfix.js
          if git diff --cached --quiet; then
            echo "Nothing to patch."
            exit 0
          fi
          git commit -m "Verify submissions through compatibility bridge"
          git push origin main
