name: Release mobile dark mode fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile-dark-fix-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bust production cache
        shell: python
        run: |
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace("site.css?v=20261013theme3", "site.css?v=20261013theme4")
          text = text.replace("config.js?v=20261013theme3", "config.js?v=20261013theme4")
          path.write_text(text, encoding="utf-8")

      - name: Publish fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Claude AOU Release"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/mobile-dark-fix-release.yml
          git commit -m "Publish working single mobile dark mode toggle"
          git push origin main
