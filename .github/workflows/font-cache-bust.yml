name: Font cache bust

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/font-cache-bust.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Force fresh typography CSS
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('site.css?v=20261013theme4', 'site.css?v=20261013font1')
          path.write_text(text, encoding='utf-8')

      - name: Publish cache bust and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Claude AOU Release"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/font-cache-bust.yml
          git add -A
          git commit -m "Force fresh Claude typography"
          git push origin main
