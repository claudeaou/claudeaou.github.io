name: Release mobile dark mode toggle

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile-dark-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bust production asset cache
        shell: python
        run: |
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace("site.css?v=20261013theme2", "site.css?v=20261013theme3")
          text = text.replace("config.js?v=20261013theme2", "config.js?v=20261013theme3")
          path.write_text(text, encoding="utf-8")

      - name: Commit release and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Claude AOU Release"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/mobile-dark-release.yml
          git commit -m "Publish single mobile dark mode toggle"
          git push origin main
