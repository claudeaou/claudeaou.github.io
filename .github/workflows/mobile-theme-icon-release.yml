name: Release dynamic mobile theme icon

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile-theme-icon-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bust config cache
        shell: python
        run: |
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace("config.js?v=20261013theme4", "config.js?v=20261013theme5")
          path.write_text(text, encoding="utf-8")

      - name: Publish icon update and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Claude AOU Release"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/mobile-theme-icon-release.yml
          git commit -m "Publish dynamic sun and moon mobile theme icon"
          git push origin main
