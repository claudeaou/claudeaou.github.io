name: Professional PDF layout fix

on:
  push:
    paths:
      - '.github/workflows/pdf-layout-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Harden generated application PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('assets/js/submission-hotfix.js')
          js = js_path.read_text(encoding='utf-8')

          replacements = [
              ('root.style.width = "190mm";', 'root.style.width = "176mm";'),
              ('width:190mm;\n          font-family:', 'width:176mm;\n          max-width:176mm;\n          margin:0 auto;\n          font-family:'),
              ('.pdf-summary{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;margin:0 0 20px}', '.pdf-summary{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:0 0 20px;width:100%}\n        .pdf-summary-card:nth-child(3){grid-column:1/-1}'),
              ('.pdf-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}', '.pdf-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;width:100%;min-width:0}'),
              ('.pdf-field-long{break-inside:auto;page-break-inside:auto}', '.pdf-field-long{break-inside:avoid;page-break-inside:avoid}'),
              ('white-space:normal}', 'white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;orphans:3;widows:3}'),
              ('margin: [10, 10, 15, 10],', 'margin: [10, 12, 14, 12],'),
              ('windowWidth: 1200', 'windowWidth: Math.max(900, node.scrollWidth + 40),\n          width: node.scrollWidth'),
              ('pagebreak: { mode: ["css", "legacy"] },', 'pagebreak: {\n          mode: ["css", "legacy"],\n          avoid: [".pdf-field", ".pdf-summary-card", ".pdf-section-head", ".pdf-note"]\n        },'),
          ]

          for old, new in replacements:
              if old not in js:
                  raise SystemExit(f'Missing expected PDF source fragment: {old[:80]}')
              js = js.replace(old, new, 1)

          js_path.write_text(js, encoding='utf-8')

          site_path = Path('assets/css/site.css')
          site = site_path.read_text(encoding='utf-8')
          site = re.sub(r'pdf-render-fix\.css\?v=[^"\)]+', 'pdf-render-fix.css?v=20261013pdf4', site)
          site_path.write_text(site, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = re.sub(r'site\.css\?v=[^"\']+', 'site.css?v=20261013pdf4', index)
          index = re.sub(r'submission-hotfix\.js\?v=[^"\']+', 'submission-hotfix.js?v=20261013pdf4', index)
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Commit PDF fix and remove one-time workflow
        run: |
          rm -f .github/workflows/pdf-layout-fix.yml
          git config user.name "Claude AOU Release"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/submission-hotfix.js assets/css/site.css index.html .github/workflows/pdf-layout-fix.yml
          git commit -m "Fix clipped and split application PDFs"
          git push origin main
