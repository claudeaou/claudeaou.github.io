name: One-time migration from hiring-cbc

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-from-hiring-cbc.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current production source
        run: |
          git clone --depth 1 https://github.com/mhmdwaelanwr/hiring-cbc.git /tmp/hiring-cbc

      - name: Copy production site into organization repo
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/hiring-cbc/ ./

          # Keep this organization repository's own Git metadata and use the
          # new organization root URL everywhere the old Pages URL was public.
          grep -RIl --exclude-dir=.git 'https://mhmdwaelanwr.github.io' . | while read -r file; do
            sed -i \
              -e 's#https://mhmdwaelanwr.github.io/hiring-cbc/#https://claudeaou.github.io/#g' \
              -e 's#https://mhmdwaelanwr.github.io#https://claudeaou.github.io#g' \
              "$file"
          done

          # This migration workflow is intentionally one-shot.
          rm -f .github/workflows/migrate-from-hiring-cbc.yml

      - name: Commit migrated site
        run: |
          git config user.name "Claude AOU Site Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to migrate."
            exit 0
          fi
          git commit -m "Migrate recruitment site to Claude AOU organization"
          git push origin main
